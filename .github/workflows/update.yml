name: Update manifest

# Keeps every manifest here in sync with its project's latest release.
# Uses only the repo's own GITHUB_TOKEN (reads the public release, writes here),
# so there is no cross-repo PAT to manage. Run it on demand from the Actions tab
# right after a release, or let the daily schedule pick it up.
on:
  schedule:
    - cron: "29 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync manifests to their latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # manifest:repo:asset64[:asset32] — one line per package. Adding a
          # project is adding a line, not another workflow.
          packages="
          bucket/sazare.json:fu-foo/fhir-sazare:sazare-server-windows-amd64.zip
          bucket/fugantt.json:fu-foo/fugantt:fugantt-windows-x86_64.zip
          bucket/fuwinlauncher.json:fu-foo/FuWinLauncher:FuWinLauncher-x64.exe:FuWinLauncher-x86.exe
          "

          # Point one architecture of $manifest at $asset of release v$VER
          update_arch() {
            local arch=$1 asset=$2 old frag url hash tmp
            # Keep any "#/name" rename suffix the manifest already uses
            old=$(jq -r --arg a "$arch" '.architecture[$a].url' "$manifest")
            frag=""
            case "$old" in *"#"*) frag="#${old#*#}" ;; esac
            url="https://github.com/$repo/releases/download/v$VER/$asset"
            hash=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
            tmp=$(mktemp)
            jq --arg a "$arch" --arg u "$url$frag" --arg h "$hash" \
              '.architecture[$a].url=$u | .architecture[$a].hash=$h' \
              "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          }

          for package in $packages; do
            IFS=: read -r manifest repo asset64 asset32 <<< "$package"

            TAG=$(gh release view --repo "$repo" --json tagName -q .tagName)
            VER=${TAG#v}
            CUR=$(jq -r .version "$manifest")

            if [ "$VER" = "$CUR" ]; then
              echo "$manifest: already at $VER"
              continue
            fi

            echo "$manifest: $CUR -> $VER"
            update_arch 64bit "$asset64"
            if [ -n "${asset32:-}" ]; then
              update_arch 32bit "$asset32"
            fi
            tmp=$(mktemp)
            jq --arg v "$VER" '.version=$v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for manifest in $(git diff --name-only); do
            name=$(basename "$manifest" .json)
            git add "$manifest"
            git commit -m "Update $name to v$(jq -r .version "$manifest")"
          done
          git push

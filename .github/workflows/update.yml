name: Update manifest

# Keeps bucket/sazare.json in sync with the latest fhir-sazare release.
# Uses only the repo's own GITHUB_TOKEN (reads the public release, writes here),
# so there is no cross-repo PAT to manage. Run it on demand from the Actions tab
# right after a release, or let the daily schedule pick it up.
on:
  schedule:
    - cron: "29 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync manifest to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=fu-foo/fhir-sazare
          TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
          VER=${TAG#v}
          CUR=$(jq -r .version bucket/sazare.json)
          if [ "$VER" = "$CUR" ]; then
            echo "Manifest already at $VER — nothing to do."
            exit 0
          fi
          echo "Updating manifest $CUR -> $VER"
          URL="https://github.com/$REPO/releases/download/v$VER/sazare-server-windows-amd64.zip"
          HASH=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          tmp=$(mktemp)
          jq --arg v "$VER" --arg u "$URL" --arg h "$HASH" \
            '.version=$v | .architecture."64bit".url=$u | .architecture."64bit".hash=$h' \
            bucket/sazare.json > "$tmp"
          mv "$tmp" bucket/sazare.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          VER=$(jq -r .version bucket/sazare.json)
          git add bucket/sazare.json
          git commit -m "Update sazare to v$VER"
          git push
